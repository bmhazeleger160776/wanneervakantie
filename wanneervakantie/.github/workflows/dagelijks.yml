name: Data ophalen en publiceren
on:
  schedule:
    - cron: "17 3 * * *"   # elke nacht om 03:17 UTC (aftellen en "nu"-markeringen blijven zo actueel)
  workflow_dispatch:       # handmatig starten via het tabblad Actions
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Schoolvakanties ophalen bij de Rijksoverheid
        run: npm run fetch-data
      - name: Nieuwe data bewaren
        run: |
          git config user.name "vakantie-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: schoolvakanties bijgewerkt $(date -u +%F)"
            git push || echo "Push van data mislukt, publiceren gaat door"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
